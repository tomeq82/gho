name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked --all-targets

      - name: Test (fuzz, smoke build only)
        run: cargo +nightly fuzz build
        continue-on-error: true

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt --check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  security:
    name: security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: security suite
        run: cargo test --test security --locked

  fuzz:
    name: fuzz (nightly smoke)
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: cargo-fuzz install
        run: cargo install cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: fuzz fastlz_decompress (60s)
        run: cargo +nightly fuzz run fastlz_decompress -- -max_total_time=60
      - name: fuzz ghost11_extract (60s)
        run: cargo +nightly fuzz run ghost11_extract -- -max_total_time=60
      - name: fuzz ghostold_walk (60s)
        run: cargo +nightly fuzz run ghostold_walk -- -max_total_time=60

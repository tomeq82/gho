name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign keyless

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin gho

      - name: Install cosign
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          curl -fsSL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign

      - name: Install cosign (windows)
        if: ${{ contains(matrix.target, 'windows') }}
        run: |
          curl -fsSL https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe -o cosign.exe
          mkdir -p /c/Users/runneradmin/bin && mv cosign.exe /c/Users/runneradmin/bin/

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="gho${{ matrix.target == 'x86_64-pc-windows-msvc' && format('.exe') || matrix.target == 'aarch64-pc-windows-msvc' && format('.exe') || '' }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd target/${{ matrix.target }}/release && zip ../../../dist/gho-${{ matrix.target }}.zip $BIN)
          else
            tar -C target/${{ matrix.target }}/release -czf dist/gho-${{ matrix.target }}.tar.gz $BIN
          fi
          sha256sum dist/gho-${{ matrix.target }}.* > dist/gho-${{ matrix.target }}.sha256

      - name: cosign sign-blob
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for f in dist/gho-${{ matrix.target }}.*; do
            case "$f" in
              *.sha256|*.sig) continue ;;
            esac
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gho-${{ matrix.target }}
          path: |
            dist/gho-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/gho*

  docker:
    name: docker multi-arch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tomeq82/gho:${{ github.ref_name }}
            ghcr.io/tomeq82/gho:latest

  release:
    name: github release
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## ${{ github.ref_name }}

            Pre-built binaries for Linux, macOS, and Windows (amd64 + arm64).
            See the [README](https://github.com/tomeq82/gho#installation) for installation instructions.

            All artifacts are signed with [cosign](https://github.com/sigstore/cosign) (keyless, via GitHub OIDC).

            ### Quick install

            ```sh
            # Linux x86_64
            curl -L https://github.com/tomeq82/gho/releases/download/${{ github.ref_name }}/gho-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv gho /usr/local/bin/
            ```

            ```sh
            # macOS arm64 (Apple Silicon)
            curl -L https://github.com/tomeq82/gho/releases/download/${{ github.ref_name }}/gho-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv gho /usr/local/bin/
            ```

            ```sh
            # Docker
            docker run --rm -v "$PWD:/data" ghcr.io/tomeq82/gho:${{ github.ref_name }} info /data/backup.gho
            ```

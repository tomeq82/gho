name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign keyless

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          # The aarch64-unknown-linux-musl target emits a
          # --fix-cortex-a53-843419 linker flag that older Ubuntu
          # runners don't recognise. Strip it.
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-musl)
              export RUSTFLAGS="-C link-arg=-Wl,--no-fix-cortex-a53-843419"
              ;;
          esac
          cargo build --release --locked --target ${{ matrix.target }} --bin gho

      - name: Install cosign
        run: |
          # Pick the right binary for this OS / arch.
          case "${{ matrix.os }}" in
            ubuntu-latest)
              BIN=cosign-linux-amd64
              DEST=/usr/local/bin/cosign
              curl -fsSL "https://github.com/sigstore/cosign/releases/latest/download/${BIN}" -o "${DEST}"
              chmod +x "${DEST}"
              ;;
            macos-13)
              BIN=cosign-darwin-amd64
              DEST=/usr/local/bin/cosign
              sudo curl -fsSL "https://github.com/sigstore/cosign/releases/latest/download/${BIN}" -o "${DEST}"
              sudo chmod +x "${DEST}"
              ;;
            macos-latest)
              BIN=cosign-darwin-arm64
              DEST=/usr/local/bin/cosign
              sudo curl -fsSL "https://github.com/sigstore/cosign/releases/latest/download/${BIN}" -o "${DEST}"
              sudo chmod +x "${DEST}"
              ;;
            windows-latest)
              BIN=cosign-windows-amd64.exe
              mkdir -p "$HOME/bin"
              curl -fsSL "https://github.com/sigstore/cosign/releases/latest/download/${BIN}" -o "$HOME/bin/cosign.exe"
              echo "$HOME/bin" >> "$GITHUB_PATH"
              ;;
          esac

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="gho${{ matrix.target == 'x86_64-pc-windows-msvc' && format('.exe') || matrix.target == 'aarch64-pc-windows-msvc' && format('.exe') || '' }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd target/${{ matrix.target }}/release && zip ../../../dist/gho-${{ matrix.target }}.zip $BIN)
          else
            tar -C target/${{ matrix.target }}/release -czf dist/gho-${{ matrix.target }}.tar.gz $BIN
          fi
          sha256sum dist/gho-${{ matrix.target }}.* > dist/gho-${{ matrix.target }}.sha256

      - name: cosign sign-blob
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for f in dist/gho-${{ matrix.target }}.*; do
            case "$f" in
              *.sha256|*.sig) continue ;;
            esac
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gho-${{ matrix.target }}
          path: |
            dist/gho-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/gho*

  docker:
    name: docker multi-arch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tomeq82/gho:${{ github.ref_name }}
            ghcr.io/tomeq82/gho:latest

  release:
    name: github release
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## ${{ github.ref_name }}

            Pre-built binaries for Linux, macOS, and Windows (amd64 + arm64).
            See the [README](https://github.com/tomeq82/gho#installation) for installation instructions.

            All artifacts are signed with [cosign](https://github.com/sigstore/cosign) (keyless, via GitHub OIDC).

            ### Quick install

            ```sh
            # Linux x86_64
            curl -L https://github.com/tomeq82/gho/releases/download/${{ github.ref_name }}/gho-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv gho /usr/local/bin/
            ```

            ```sh
            # macOS arm64 (Apple Silicon)
            curl -L https://github.com/tomeq82/gho/releases/download/${{ github.ref_name }}/gho-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv gho /usr/local/bin/
            ```

            ```sh
            # Docker
            docker run --rm -v "$PWD:/data" ghcr.io/tomeq82/gho:${{ github.ref_name }} info /data/backup.gho
            ```

[package]
name = "gho"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Tomasz Glowacki <tomeq82@users.noreply.github.com>"]
license = "MIT"
description = "Pure-Rust extractor for Norton Ghost .GHO/.GHS disk images (formats 11.x-12.x and pre-11.x)"
repository = "https://github.com/tomeq82/gho"
homepage = "https://github.com/tomeq82/gho"
readme = "README.md"
keywords = ["ghost", "norton", "gho", "ghs", "backup", "disk-image", "extract", "reverse-engineering"]
categories = ["command-line-utilities", "filesystem", "parsing"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "README.md", "docs/**/*.md"]

[lib]
name = "gho"
path = "src/lib.rs"

[[bin]]
name = "gho"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
flate2 = "1.1"

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1.41"
tempfile = "3.13"
assert_matches = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
